<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Шаурма-империя</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="loading"><div class="logo">🌯</div><p id="loadingText">Разогреваем гриль…</p></div>

  <div id="app" hidden>
    <header id="hud">
      <div class="hud-row">
        <div id="tags"></div>
        <button id="dailyBtn" class="icon-btn" aria-label="Ежедневная награда">🎁<i class="dot" hidden></i></button>
      </div>
      <div class="money"><span id="money">0</span> <small>₸</small></div>
      <div class="rate"><span id="rate">0</span> ₸/сек</div>
    </header>

    <main>
      <section id="bizScreen">
        <button id="eventBanner" class="event-banner" hidden><b>⚡ Мага звонит: ситуация</b><span>Нужно твоё решение</span></button>
        <div id="sceneTabs" class="scene-tabs"></div>
        <div id="tapBtn" class="scene day" role="button" aria-label="Обслужить клиента">
          <div id="stageWrap"></div>
          <div id="custLayer"></div>
          <div id="bubble" class="bubble"></div>
        </div>
        <div class="dayrow">
          <div><b id="dayLabel">День 1</b> <span id="clock" class="muted">06:00</span></div>
          <div id="speedBox" class="speed"></div>
        </div>
        <div class="tap-hint">клиентов за день <b id="custToday">0</b> · выручка <b id="revToday">0</b> ₸ · тап <b id="tapVal">1</b> ₸</div>
        <div id="staffList" class="staff"></div>
        <div class="pricecard">
          <div class="row">
            <div><div class="muted">Цена донера</div><div class="pv"><span id="priceVal">1500</span> ₸</div></div>
            <div class="pbtns"><button id="priceDown" aria-label="Дешевле">−</button><button id="priceUp" aria-label="Дороже">+</button></div>
          </div>
          <div class="pstats"><span>Спрос <b id="pDemand">100%</b></span><span>Прибыль с донера <b id="pProfit">0</b> ₸</span></div>
          <div class="phint" id="pHint"></div>
        </div>
        <div class="mode" id="buyMode">
          <button data-m="1" class="on">×1</button><button data-m="10">×10</button><button data-m="max">Макс</button>
        </div>
        <div id="bizList"></div>
      </section>
      <section id="otherScreen" hidden></section>
    </main>

    <nav id="tabs">
      <button data-tab="biz" class="on"><i>🏪</i>Бизнес</button>
      <button data-tab="franchise"><i>👑</i>Франшиза</button>
      <button data-tab="shop"><i>⭐</i>Магазин</button>
      <button data-tab="top"><i>🏆</i>Рейтинг</button>
      <button data-tab="friends"><i>🤝</i>Друзья</button>
    </nav>
  </div>

  <div id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
